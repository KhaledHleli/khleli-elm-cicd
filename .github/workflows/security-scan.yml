name: Pulse Security Scan

on:
  workflow_dispatch:

permissions:
  contents: read
  packages: read

jobs:
  security-scan:
    runs-on: ubuntu-24.04

    steps:
      - name: Login to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Scan Docker Image with Trivy
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: image
          image-ref: ghcr.io/khaledhleli/khleli-elm-cicd:latest
          format: table
          severity: CRITICAL
          exit-code: '1'
